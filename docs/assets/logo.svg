<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Outer Border with Glow -->
  <polygon points="100,16 174,58 174,142 100,184 26,142 26,58" 
           fill="url(#grad2)" stroke="url(#grad1)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Multi-Tier Compiler Layer Ribbons -->
  <!-- Top Layer: High-Level IR -->
  <path d="M 60,68 L 100,45 L 140,68 L 100,91 Z" 
        fill="#38bdf8" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Middle Layer: Pass-Internal SSA IR -->
  <path d="M 60,98 L 100,75 L 140,98 L 100,121 Z" 
        fill="#6366f1" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Bottom Layer: Target-Low & Binary Machine Code -->
  <path d="M 60,128 L 100,105 L 140,128 L 100,151 Z" 
        fill="#a855f7" fill-opacity="0.9" stroke="#ffffff" stroke-width="1.5" />

  <!-- Central Energy Core / Compilation Dot -->
  <circle cx="100" cy="98" r="4.5" fill="#ffffff" />
</svg>
